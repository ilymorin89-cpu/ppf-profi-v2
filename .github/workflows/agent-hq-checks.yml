name: Agent HQ checks

on:
  push:
    branches: ["agent-hq-runtime-skeleton", "feat/vk-content-army", "agent-hq/enable-research-tools"]
    paths:
      - "scripts/agent-hq-*.mjs"
      - "tests/agent-hq*.mjs"
      - "tests/agent-hq*.sql"
      - "Dockerfile.agent-hq"
      - "Dockerfile.agent-hq"
      - "drizzle/0003_agent_hq.sql"
      - "drizzle/0004_agent_budget.sql"
      - "drizzle/0005_agent_approval_idempotency.sql"
      - "drizzle/0006_agent_web_search_budget.sql"
      - "drizzle/0007_agent_task_access.sql"
      - "docs/agent-hq/**"
      - "deploy/systemd/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-hq-checks.yml"
  pull_request:
    paths:
      - "scripts/agent-hq-*.mjs"
      - "tests/agent-hq*.mjs"
      - "drizzle/0003_agent_hq.sql"
      - "drizzle/0004_agent_budget.sql"
      - "drizzle/0005_agent_approval_idempotency.sql"
      - "drizzle/0006_agent_web_search_budget.sql"
      - "drizzle/0007_agent_task_access.sql"
      - "docs/agent-hq/**"
      - "deploy/systemd/**"
      - "package.json"
      - ".github/workflows/agent-hq-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: agent_test
          POSTGRES_DB: agent_hq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_hq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_HQ_TEST_DATABASE_URL: postgres://agent_test:agent_test@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_SEO: postgres://agent_seo:ci_agent_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_QA: postgres://agent_qa_security:ci_agent_qa@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_COORDINATOR: postgres://agent_coordinator:ci_agent_coordinator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_SUPERVISOR: postgres://agent_supervisor:ci_agent_supervisor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_OPERATOR: postgres://agent_operator:ci_agent_operator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COORDINATOR: postgres://agent_coordinator:ci_agent_coordinator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_WEB_ENGINEER: postgres://agent_web_engineer:ci_agent_web_engineer@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_SEO: postgres://agent_seo:ci_agent_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_GEO: postgres://agent_geo:ci_agent_geo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_GROWTH: postgres://agent_growth:ci_agent_growth@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_ANALYTICS: postgres://agent_analytics:ci_agent_analytics@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_QA_SECURITY: postgres://agent_qa_security:ci_agent_qa_security@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_VK_STRATEGIST: postgres://agent_vk_strategist:ci_agent_vk_strategist@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COPYWRITER: postgres://agent_copywriter:ci_agent_copywriter@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_DESIGNER: postgres://agent_designer:ci_agent_designer@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_IMAGE_GENERATOR: postgres://agent_image_generator:ci_agent_image_generator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_STORYTELLER: postgres://agent_storyteller:ci_agent_storyteller@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COMMUNITY_MANAGER: postgres://agent_community_manager:ci_agent_community_manager@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_CONTENT_SEO: postgres://agent_content_seo:ci_agent_content_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_ADS_MANAGER: postgres://agent_ads_manager:ci_agent_ads_manager@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_TREND_SCOUT: postgres://agent_trend_scout:ci_agent_trend_scout@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_AUTO_NEWS_EDITOR: postgres://agent_auto_news_editor:ci_agent_auto_news_editor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_AUTO_LAW_MONITOR: postgres://agent_auto_law_monitor:ci_agent_auto_law_monitor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_FACT_CHECKER: postgres://agent_fact_checker:ci_agent_fact_checker@localhost:5432/agent_hq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Apply Agent HQ migrations to disposable PostgreSQL
        run: |
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0003_agent_hq.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0004_agent_budget.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0005_agent_approval_idempotency.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0006_agent_web_search_budget.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0007_agent_task_access.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/agent-hq-role-isolation.sql
      - name: Check Agent HQ JavaScript syntax
        run: |
          node --check scripts/agent-hq-bus.mjs
          node --check scripts/agent-hq-worker.mjs
          node --check scripts/agent-hq-supervisor.mjs
          node --check scripts/agent-hq-launch.mjs
          node --check tests/agent-hq.integration.test.mjs
          node --check tests/agent-hq.role-matrix.test.mjs
      - name: Run PostgreSQL integration tests
        run: npm run agent-hq:test
      - name: Verify systemd unit syntax
        run: systemd-analyze verify deploy/systemd/agent-hq-worker@.service deploy/systemd/agent-hq-supervisor.service
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build Agent HQ runtime container (no deployment)
        run: docker build --file Dockerfile.agent-hq --tag ppf-agent-hq:ci .

  website-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build PPF PROFI website
        run: npm run build
