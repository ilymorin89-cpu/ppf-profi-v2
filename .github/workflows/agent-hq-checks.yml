name: Agent HQ checks

on:
  push:
    branches: ["agent-hq-runtime-skeleton", "feat/vk-content-army", "agent-hq/enable-research-tools", "agent-hq/**"]
    paths:
      - "scripts/agent-hq-*.mjs"
      - "scripts/agent-hq-*.sh"
      - "scripts/agent-hq-db-connectivity-check.mjs"
      - "docker-compose.agent-hq-test.yml"
      - "docker-compose.agent-hq-four-agent-test.yml"
      - "tests/agent-hq*.mjs"
      - "tests/agent-hq*.sql"
      - "tests/agent-hq-db-connectivity-check.test.mjs"
      - "Dockerfile.agent-hq"
      - "drizzle/0003_agent_hq.sql"
      - "drizzle/0004_agent_budget.sql"
      - "drizzle/0005_agent_approval_idempotency.sql"
      - "drizzle/0006_agent_web_search_budget.sql"
      - "drizzle/0007_agent_task_access.sql"
      - "drizzle/0008_agent_budget_trusted_settlement.sql"
      - "drizzle/0009_agent_hq_runtime_rls.sql"
      - "drizzle/0010_agent_hq_authenticated_worker_identity.sql"
      - "drizzle/0011_agent_hq_readonly_monitor.sql"
      - "tests/agent-hq-register-test-workers.sql"
      - "tests/agent-hq-provision-test-roles.sql"
      - "docs/agent-hq/**"
      - "deploy/systemd/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-hq-checks.yml"
  pull_request:
    paths:
      - "scripts/agent-hq-*.mjs"
      - "tests/agent-hq*.mjs"
      - "scripts/agent-hq-db-connectivity-check.mjs"
      - "tests/agent-hq-db-connectivity-check.test.mjs"
      - "drizzle/0003_agent_hq.sql"
      - "drizzle/0004_agent_budget.sql"
      - "drizzle/0005_agent_approval_idempotency.sql"
      - "drizzle/0006_agent_web_search_budget.sql"
      - "drizzle/0007_agent_task_access.sql"
      - "drizzle/0008_agent_budget_trusted_settlement.sql"
      - "drizzle/0009_agent_hq_runtime_rls.sql"
      - "drizzle/0010_agent_hq_authenticated_worker_identity.sql"
      - "tests/agent-hq-register-test-workers.sql"
      - "tests/agent-hq-provision-test-roles.sql"
      - "tests/agent-hq-role-isolation.sql"
      - "tests/agent-hq-test-helpers.sql"
      - "docs/agent-hq/**"
      - "deploy/systemd/**"
      - "package.json"
      - ".github/workflows/agent-hq-checks.yml"
      - "scripts/agent-hq-*.sh"
      - "docker-compose.agent-hq-test.yml"
      - "docker-compose.agent-hq-four-agent-test.yml"
      - "Dockerfile.agent-hq"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: agent_test
          POSTGRES_DB: agent_hq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_hq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_HQ_TEST_DATABASE_URL: postgres://agent_test:agent_test@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_SEO: postgres://agent_seo:ci_agent_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_QA: postgres://agent_qa_security:ci_agent_qa@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_QA_SECURITY: postgres://agent_qa_security:ci_agent_qa@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_COORDINATOR: postgres://agent_coordinator:ci_agent_coordinator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_SUPERVISOR: postgres://agent_supervisor:ci_agent_supervisor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_OPERATOR: postgres://agent_operator:ci_agent_operator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COORDINATOR: postgres://agent_coordinator:ci_agent_coordinator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_WEB_ENGINEER: postgres://agent_web_engineer:ci_agent_web_engineer@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_SEO: postgres://agent_seo:ci_agent_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_GEO: postgres://agent_geo:ci_agent_geo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_GROWTH: postgres://agent_growth:ci_agent_growth@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_ANALYTICS: postgres://agent_analytics:ci_agent_analytics@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_QA_SECURITY: postgres://agent_qa_security:ci_agent_qa@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_VK_STRATEGIST: postgres://agent_vk_strategist:ci_agent_vk_strategist@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COPYWRITER: postgres://agent_copywriter:ci_agent_copywriter@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_DESIGNER: postgres://agent_designer:ci_agent_designer@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_IMAGE_GENERATOR: postgres://agent_image_generator:ci_agent_image_generator@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_STORYTELLER: postgres://agent_storyteller:ci_agent_storyteller@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_COMMUNITY_MANAGER: postgres://agent_community_manager:ci_agent_community_manager@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_CONTENT_SEO: postgres://agent_content_seo:ci_agent_content_seo@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_ADS_MANAGER: postgres://agent_ads_manager:ci_agent_ads_manager@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_TREND_SCOUT: postgres://agent_trend_scout:ci_agent_trend_scout@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_AUTO_NEWS_EDITOR: postgres://agent_auto_news_editor:ci_agent_auto_news_editor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_AUTO_LAW_MONITOR: postgres://agent_auto_law_monitor:ci_agent_auto_law_monitor@localhost:5432/agent_hq_test
      AGENT_HQ_ROLE_TEST_URL_ROLE_FACT_CHECKER: postgres://agent_fact_checker:ci_agent_fact_checker@localhost:5432/agent_hq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject high and critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Provision disposable CI-only PostgreSQL LOGIN roles
        run: psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/agent-hq-provision-test-roles.sql
      - name: Apply production Agent HQ migration chain to disposable PostgreSQL
        run: |
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0003_agent_hq.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0004_agent_budget.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0005_agent_approval_idempotency.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0006_agent_web_search_budget.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0007_agent_task_access.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0008_agent_budget_trusted_settlement.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0009_agent_hq_runtime_rls.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0010_agent_hq_authenticated_worker_identity.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0011_agent_hq_readonly_monitor.sql
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/agent-hq-register-test-workers.sql
      - name: Assert migration-only RLS and least-privilege boundary
        run: psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/agent-hq-role-isolation.sql
      - name: Apply disposable CI-only aggregate helper after migration assertions
        run: psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/agent-hq-test-helpers.sql
      - name: Check Agent HQ JavaScript syntax
        run: |
          node --check scripts/agent-hq-bus.mjs
          node --check scripts/agent-hq-worker.mjs
          node --check scripts/agent-hq-supervisor.mjs
          node --check scripts/agent-hq-supervisor-lifecycle.mjs
          node --check scripts/agent-hq-worker-lifecycle.mjs
          node --check scripts/agent-hq-staging-preflight.mjs
          node --check scripts/agent-hq-monitor.mjs
          node --check scripts/agent-hq-db-connectivity-check.mjs
          node --check scripts/agent-hq-launch.mjs
          node --check scripts/agent-hq-simulate.mjs
          node --check scripts/agent-hq-four-agent-e2e.mjs
          node --check scripts/agent-hq-test-assert.mjs
          node --check scripts/agent-hq-db-connectivity-check.mjs
          node --test tests/agent-hq-db-connectivity-check.test.mjs
          node --check tests/agent-hq.integration.test.mjs
          node --check tests/agent-hq.role-matrix.test.mjs
      - name: Run PostgreSQL integration tests
        run: npm run agent-hq:test
      - name: Run deterministic isolated role smoke checks against disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          TASK_IDS=()
          cleanup() {
            for task_id in "${TASK_IDS[@]}"; do
              psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM agent_budget_ledger WHERE reservation_id IN (SELECT id FROM agent_budget_reservations WHERE task_id=$task_id); DELETE FROM agent_budget_settlements WHERE reservation_id IN (SELECT id FROM agent_budget_reservations WHERE task_id=$task_id); DELETE FROM agent_budget_reservations WHERE task_id=$task_id; DELETE FROM agent_messages WHERE task_id=$task_id; DELETE FROM agent_artifacts WHERE task_id=$task_id; DELETE FROM agent_runs WHERE task_id=$task_id; DELETE FROM agent_tasks WHERE id=$task_id;" || true
            done
            psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE agent_budget_config SET enabled=false,daily_cap_microusd=0,monthly_cap_microusd=0,per_run_cap_microusd=0,input_price_per_million_microusd=0,output_price_per_million_microusd=0,updated_at=now() WHERE id=1;" || true
          }
          trap cleanup EXIT
          # The integration suite intentionally leaves negative-test fixtures behind.
          # Clear only queued fixtures in this disposable CI database so workers cannot
          # accidentally claim an older task instead of the simulation's own task.
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE agent_tasks SET status='cancelled',updated_at=now() WHERE assigned_role IN ('coordinator','seo','qa_security') AND status='queued';"
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE agent_budget_config SET enabled=true,daily_cap_microusd=1000000,monthly_cap_microusd=5000000,per_run_cap_microusd=100000,input_price_per_million_microusd=1,output_price_per_million_microusd=1,web_search_price_microusd_per_call=0,updated_at=now() WHERE id=1;"
          COORDINATOR_TASK_ID="$(psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "INSERT INTO agent_tasks (title,objective,expected_output,assigned_role,created_by) VALUES ('CI no-spend coordinator ${GITHUB_RUN_ID}','Complete one deterministic coordinator pass','Persist one artifact and enter review','coordinator','owner') RETURNING id;")"
          TASK_IDS+=("$COORDINATOR_TASK_ID")
          SEO_TASK_ID="$(psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "INSERT INTO agent_tasks (title,objective,expected_output,assigned_role,created_by) VALUES ('CI no-spend SEO ${GITHUB_RUN_ID}','Complete one deterministic SEO pass','Persist one artifact and complete the task','seo','owner') RETURNING id;")"
          TASK_IDS+=("$SEO_TASK_ID")
          QA_TASK_ID="$(psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "INSERT INTO agent_tasks (title,objective,expected_output,assigned_role,created_by) VALUES ('CI no-spend QA ${GITHUB_RUN_ID}','Complete one deterministic QA pass','Persist one artifact and complete the task','qa_security','owner') RETURNING id;")"
          TASK_IDS+=("$QA_TASK_ID")
          npm run agent-hq:simulate -- check coordinator
          npm run agent-hq:simulate -- run coordinator
          # The deterministic coordinator fixture returns text rather than delegating.
          # Move its completed task into review to exercise the supervisor's review pass.
          psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE agent_tasks SET status='review',completed_at=NULL,updated_at=now() WHERE id=$COORDINATOR_TASK_ID;"
          npm run agent-hq:simulate -- check seo
          npm run agent-hq:simulate -- run seo
          npm run agent-hq:simulate -- check qa_security
          npm run agent-hq:simulate -- run qa_security
          npm run agent-hq:simulate -- check supervisor
          npm run agent-hq:simulate -- run supervisor
          for task_id in "${TASK_IDS[@]}"; do
            RESULT="$(psql "$AGENT_HQ_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT t.status || '|' || (SELECT count(*) FROM agent_artifacts a WHERE a.task_id=t.id) || '|' || (SELECT count(*) FROM agent_runs r WHERE r.task_id=t.id AND r.status='succeeded' AND r.provider='test_stub' AND r.cost_microusd=0) FROM agent_tasks t WHERE t.id=$task_id;")"
            if [ "$RESULT" != "done|1|1" ]; then
              echo "Unexpected no-spend simulation result for task $task_id: $RESULT"
              exit 1
            fi
          done
          echo "Deterministic zero-cost isolated role smoke checks completed successfully."
      - name: Verify systemd unit syntax
        run: systemd-analyze verify deploy/systemd/agent-hq-worker@.service deploy/systemd/agent-hq-supervisor.service
      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.agent-hq-test.yml config --quiet
          docker compose -f docker-compose.agent-hq-four-agent-test.yml config --quiet
      - name: Build Agent HQ runtime container (no deployment)
        run: docker build --file Dockerfile.agent-hq --tag ppf-agent-hq:ci .

  all-19-container-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all 19 workers on an isolated no-egress disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose -f docker-compose.agent-hq-test.yml "$@"
          }
          cleanup() {
            compose logs --no-color --tail=80 || true
            compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          # The overlay uses an internal-only Docker network and an in-memory DB.
          # No host port is published; worker containers have no outbound network.
          compose up -d postgres
          # Starting workers also starts db-init exactly once via service_completed_successfully.
          compose up -d --build \
            coordinator web_engineer seo geo growth analytics qa_security \
            vk_strategist copywriter designer image_generator storyteller \
            community_manager content_seo ads_manager trend_scout \
            auto_news_editor auto_law_monitor fact_checker supervisor
          compose run --rm test-assert
          echo "All 19 role containers completed deterministic zero-cost tasks."

  four-agent-orchestration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run real Coordinator -> SEO -> QA Security -> Supervisor flow with no egress
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose -f docker-compose.agent-hq-four-agent-test.yml "$@"
          }
          cleanup() {
            compose logs --no-color --tail=120 || true
            compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          # Compose's internal-only network prevents outbound traffic. The
          # orchestrator starts real worker processes with separate PostgreSQL
          # LOGINs and deterministic fixtures; the disposable DB is in tmpfs.
          compose up --build --abort-on-container-exit --exit-code-from orchestrated-core orchestrated-core
          echo "Four-agent deterministic no-egress orchestration completed successfully."

  website-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@127.0.0.1:5432/build_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build PPF PROFI website
        run: npm run build
