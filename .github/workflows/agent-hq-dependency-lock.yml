name: Agent HQ dependency lock refresh

on:
  push:
    branches: ["agent-hq/enable-research-tools"]
    paths: [".github/workflows/agent-hq-dependency-lock.yml"]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hq/enable-research-tools
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update patched framework and React versions and resolve lockfile
        run: |
          npm pkg set 'dependencies.next=16.4.6' 'dependencies.react=19.3.1' 'dependencies.react-dom=19.3.1' 'devDependencies.eslint-config-next=16.4.6'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile-backed security updates to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo 'No dependency changes'; exit 0; fi
          git commit -m 'fix(deps): patch Next.js and React security releases'
          git push origin HEAD:agent-hq/enable-research-tools
