  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    init: true
    command:
      - sh
      - -lc
      - |
        if [ "$AGENT_HQ_WORKERS_ENABLED" != "true" ] || [ "$AGENT_HQ_SUPERVISOR_ENABLED" != "true" ]; then
          echo "Agent HQ supervisor disabled by global/control gate";
          exec sleep infinity;
        fi
        if [ -z "$DATABASE_URL" ]; then echo "Missing supervisor DATABASE_URL"; exit 1; fi
        exec node scripts/agent-hq-supervisor.mjs
    environment:
      NODE_ENV: production
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_SUPERVISOR:-}
      AGENT_HQ_WORKERS_ENABLED: ${AGENT_HQ_WORKERS_ENABLED:-false}
      AGENT_HQ_SUPERVISOR_ENABLED: ${AGENT_HQ_SUPERVISOR_ENABLED:-false}
      AGENT_POLL_MS: ${AGENT_POLL_MS:-5000}
    restart: unless-stopped
    security_opt:
