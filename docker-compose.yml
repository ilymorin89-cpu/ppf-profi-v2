# Agent HQ live runtime Compose. This is NOT the no-egress test stack.
# All processes and external calls remain disabled unless explicitly enabled.
x-agent-hq-worker: &agent-hq-worker
  image: ppf-agent-hq:runtime
  build:
    context: .
    dockerfile: Dockerfile.agent-hq
  init: true
  command: &agent-hq-worker-command
    - sh
    - -lc
    - |
      if [ "$AGENT_HQ_WORKERS_ENABLED" != "true" ] || [ "$AGENT_HQ_ROLE_ENABLED" != "true" ]; then
        echo "Agent HQ worker disabled by global/role gate; waiting";
        exec sleep infinity;
      fi
      if [ -z "$DATABASE_URL" ]; then echo "Missing role-specific DATABASE_URL"; exit 1; fi
      if [ -z "$OPENAI_API_KEY" ] || [ -z "$AGENT_MODEL" ]; then echo "Missing provider key or model"; exit 1; fi
      exec node scripts/agent-hq-worker.mjs
  environment: &agent-hq-worker-environment
    NODE_ENV: production
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    AGENT_MODEL: ${AGENT_MODEL:-}
    AGENT_HQ_WORKERS_ENABLED: ${AGENT_HQ_WORKERS_ENABLED:-false}
    AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-1200}
    AGENT_POLL_MS: ${AGENT_POLL_MS:-5000}
    AGENT_WEB_SEARCH_ENABLED: ${AGENT_WEB_SEARCH_ENABLED:-false}
    GITHUB_TOKEN: ${AGENT_GITHUB_READ_TOKEN:-}
    AGENT_GITHUB_REPOSITORY: ${AGENT_GITHUB_REPOSITORY:-}
    AGENT_GITHUB_REF: ${AGENT_GITHUB_REF:-main}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
services:
  gateway:
    profiles: ["optional-health"]
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    command: ["node", "scripts/agent-hq-health.mjs"]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_SUPERVISOR:-}
    restart: unless-stopped

  coordinator:
    <<: *agent-hq-worker
    environment:
      <<: *agent-hq-worker-environment
      AGENT_ROLE: coordinator
      AGENT_HQ_ROLE_ENABLED: ${AGENT_HQ_ENABLE_COORDINATOR:-false}
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_COORDINATOR:-}

  web_engineer:
