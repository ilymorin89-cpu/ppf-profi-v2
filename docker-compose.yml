services:
  gateway:
    profiles: ["optional-health"]
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    command: ["node", "scripts/agent-hq-health.mjs"]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL:-}
    restart: unless-stopped

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    command: ["sh", "-lc", "if [ \"$AGENT_HQ_WORKERS_ENABLED\" != \"true\" ] || [ \"$NODE_ENV\" != \"test\" ] || [ -z \"$AGENT_HQ_TEST_RESPONSES_JSON\" ]; then echo 'Agent HQ workers disabled; no-spend test fixture required'; exec sleep infinity; fi; node scripts/agent-hq-test-preflight.mjs && exec node scripts/agent-hq-worker.mjs"]
    environment:
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_COORDINATOR:-}
      OPENAI_API_KEY: test-no-provider-call
      AGENT_MODEL: test-model
      NODE_ENV: test
      AGENT_HQ_TEST_RESPONSES_JSON: ${AGENT_HQ_TEST_RESPONSES_JSON:-}
      AGENT_ROLE: coordinator
      AGENT_HQ_WORKERS_ENABLED: ${AGENT_HQ_WORKERS_ENABLED:-false}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-1200}
      AGENT_POLL_MS: ${AGENT_POLL_MS:-5000}
      AGENT_WEB_SEARCH_ENABLED: "false"
      GITHUB_TOKEN: ""
      AGENT_GITHUB_REPOSITORY: ""
      AGENT_GITHUB_REF: ${AGENT_GITHUB_REF:-main}
    restart: unless-stopped

