      AGENT_GITHUB_REF: ${AGENT_GITHUB_REF:-main}
    restart: unless-stopped

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    command: ["sh", "-lc", "if [ \"$AGENT_HQ_WORKERS_ENABLED\" != \"true\" ] || [ \"$NODE_ENV\" != \"test\" ]; then echo 'Agent HQ supervisor disabled; test mode required'; exec sleep infinity; fi; node scripts/agent-hq-test-preflight.mjs && exec node scripts/agent-hq-supervisor.mjs"]
    environment:
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_SUPERVISOR:-}
      AGENT_ROLE: supervisor
      AGENT_HQ_WORKERS_ENABLED: ${AGENT_HQ_WORKERS_ENABLED:-false}
      NODE_ENV: test
      AGENT_POLL_MS: ${AGENT_POLL_MS:-5000}
    restart: unless-stopped
