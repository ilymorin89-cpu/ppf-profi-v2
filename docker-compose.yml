      <<: *agent-hq-worker-environment
      AGENT_ROLE: web_engineer
      AGENT_HQ_ROLE_ENABLED: ${AGENT_HQ_ENABLE_WEB_ENGINEER:-false}
      DATABASE_URL: ${AGENT_HQ_DATABASE_URL_WEB_ENGINEER:-}

  seo:
    <<: *agent-hq-worker
    environment:
      <<: *agent-hq-worker-environment
      AGENT_ROLE: seo
      AGENT_HQ_ROLE_ENABLED: ${AGENT_HQ_ENABLE_SEO:-false}
