x-agent-hq-test-env: &agent-hq-test-env
  NODE_ENV: test
  AGENT_HQ_WORKERS_ENABLED: "true"
  OPENAI_API_KEY: test-no-provider-call
  AGENT_MODEL: test-model
  AGENT_HQ_TEST_RESPONSES_JSON: '{"output":[{"type":"message","content":[{"type":"output_text","text":"NO-SPEND E2E: deterministic fixture response; no external provider or tool was called."}]}],"usage":{"input_tokens":0,"output_tokens":0}}'
  AGENT_WEB_SEARCH_ENABLED: "false"
  GITHUB_TOKEN: ""
  AGENT_GITHUB_REPOSITORY: ""

x-agent-hq-no-spend-worker: &agent-hq-no-spend-worker
  image: ppf-agent-hq:test
  environment:
    <<: *agent-hq-test-env
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_test
      POSTGRES_PASSWORD: agent_test
      POSTGRES_DB: agent_hq_test
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_test -d agent_hq_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

  db-init:
    image: postgres:16
    environment:
      AGENT_HQ_TEST_DATABASE_URL: postgres://agent_test:agent_test@postgres:5432/agent_hq_test
    volumes:
      - .:/workspace:ro
    entrypoint: ["sh", "/workspace/scripts/agent-hq-test-bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  test-assert:
    image: ppf-agent-hq:test
    build:
      context: .
      dockerfile: Dockerfile.agent-hq
    command: ["node", "scripts/agent-hq-test-assert.mjs"]
    environment:
      AGENT_HQ_TEST_DATABASE_URL: postgres://agent_test:agent_test@postgres:5432/agent_hq_test
      AGENT_HQ_TEST_MARKER: agent_hq_19role_e2e
      AGENT_HQ_TEST_TIMEOUT_MS: "120000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  coordinator:
    <<: *agent-hq-no-spend-worker
    environment:
      <<: *agent-hq-test-env
      DATABASE_URL: postgres://agent_coordinator:ci_agent_coordinator@postgres:5432/agent_hq_test

  web_engineer:
    <<: *agent-hq-no-spend-worker
    environment:
      <<: *agent-hq-test-env
      DATABASE_URL: postgres://agent_web_engineer:ci_agent_web_engineer@postgres:5432/agent_hq_test

